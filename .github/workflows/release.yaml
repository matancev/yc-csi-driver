name: Create a new release

on:
  push:
    tags:
      - 'v*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Install dependencies
        run: go install github.com/vektra/mockery/v2@v2.43.2

      - name: Generate
        run: go generate ./... && git diff --exit-code

      - name: Build
        run: go build -o=/dev/null ./cmd/...

      - name: Lint
        uses: golangci/golangci-lint-action@v5.0.0
        with:
          args: --timeout 3m

      - name: Run tests
        run: go test -race -shuffle=on -v ./...

  push:
    runs-on: ubuntu-22.04
    needs: test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push Docker image
        env:
          REGISTRY_ID: crprn8m7f5t2oj2em8ln
          IMAGE_NAME_PREFIX: yc-csi
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          NODE_IMAGE=cr.yandex/${REGISTRY_ID}/${IMAGE_NAME_PREFIX}-node:${IMAGE_TAG}
          CONTROLLER_IMAGE=cr.yandex/${REGISTRY_ID}/${IMAGE_NAME_PREFIX}-controller:${IMAGE_TAG}
          
          docker build -t ${NODE_IMAGE} -f build/package/Dockerfile.node .
          docker build -t ${CONTROLLER_IMAGE} -f build/package/Dockerfile.controller .
          
          docker push ${NODE_IMAGE}
          docker push ${CONTROLLER_IMAGE}